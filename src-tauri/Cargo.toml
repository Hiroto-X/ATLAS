[package]
name = "atlas"
version = "0.1.0"
description = "Explore your digital universe"
authors = ["ATLAS"]
edition = "2021"

[lib]
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json="1"
directories = "6.0.0"

[dev-dependencies]
tempfile = "3.27.0"
